# Copy these keys under `wallet_node.bnb` in config.yml.
# Keep router/bridge parsing disabled until operations has verified official source contracts.
contract_addr:
  # Binance-Peg BSC USDT
  - "0x55d398326f99059fF775485246999027B3197955"
  # Binance-Peg BSC USDC
  - "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d"

deposit_policy:
  enabled: true
  reject_failed_receipts: true

  # Direct ERC20 transfers still use wallet_node.bnb.contract_addr as the token whitelist.
  direct_transfer:
    enabled: true

  # AA handleOps parsing still uses wallet_node.bnb.aa.entry_point as the EntryPoint source.
  aa_handle_ops:
    enabled: true
    entry_points: []

  router_receipt:
